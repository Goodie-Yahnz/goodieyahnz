<!DOCTYPE html>
<html>
<head>
  <title>Resultly</title>
</head>
<body style="background-color: black; color: lightyellow; font-size: 30px;">
  <header id="header">
    <button style="width: 100px; height: 50px; background-color: yellow;" onclick="document.getElementById('addsub').style.display = 'block';">Subject Settings</button>
  </header>
  <div id="opener">
    BEFORE YOU START
    <input type="text" style="width: 200px; height: 50px;" placeholder="Enter Subject" id="stuname">
    <input type="text" style="width: 150px; height: 50px;" placeholder="Enter Student's Class" id="stulass">
    <input type="text" style="width: 250px; height: 50px;" placeholder="Enter Student's School" id="stuhool">
    <button onclick="
      document.getElementById('header').style.display = 'block';
      document.getElementById('opener').style.display = 'none';
      namee.innerHTML = 'Result of '+stuname.value+', for the students of '+stuhool.value+' in '+stulass.value+' class.'; 
      ">OK</button>
  </div>
  <div id="addsub" style="display: none;">
    ADD SUBJECT
    <input type="text" style="width: 150px; height: 50px;" placeholder="Enter Student's Name" id="subj">
    <input type="number" style="width: 150px; height: 50px;" placeholder="Enter 1st C.A.T." id="catone">
    <input type="number" style="width: 150px; height: 50px;" placeholder="Enter 2nd C.A.T." id="cattwo">
    <input type="number" style="width: 150px; height: 50px;" placeholder="Enter Examination Score" id="examsc">
    <input type="text" style="width: 150px; height: 50px;" placeholder="Enter Grade eg, A, A1, A+, etc." id="egrade">
    <input type="text" style="width: 150px; height: 50px;" placeholder="Enter Position" id="post">
     <button onclick="
      document.getElementById('addsub').style.display = 'none';
      document.getElementById('scorsy').innerHTML =   Number(catone.value) + Number(cattwo.value) + Number(examsc.value);
      const total = Function('return '+document.getElementById('scorsy').innerHTML);
      const newsubja = document.createElement('p');
      newsubja.id = subj.value+'scoresubj';
      newsubja.innerHTML = subj.value;
      const newsubjb = document.createElement('p');
      newsubjb.id = subj.value+'scorecatone';
      newsubjb.innerHTML = catone.value;
      const newsubjc = document.createElement('p');
      newsubjc.id = subj.value+'scorecattwo';
      newsubjc.innerHTML = cattwo.value;
      const newsubjd = document.createElement('p');
      newsubjd.id = subj.value+'scoreexamsc';
      newsubjd.innerHTML = examsc.value;
      const newsubje = document.createElement('p');
      newsubje.id = subj.value+'scorettl';
      newsubje.innerHTML = Number(cattwo.value) + Number(catone.value) + Number(examsc.value);
      const newsubjf = document.createElement('p');
      newsubjf.id = subj.value+'scoregr';
      newsubjf.innerHTML = egrade.value;
     const newsubjg = document.createElement('p');
      newsubjg.id = subj.value+'pst';
      newsubjg.innerHTML = post.value;
      document.getElementById('nadiv').appendChild(newsubja);
      document.getElementById('codiv').appendChild(newsubjb);
      document.getElementById('ctdiv').appendChild(newsubjc);
      document.getElementById('exdiv').appendChild(newsubjd);
      document.getElementById('todiv').appendChild(newsubje);
      document.getElementById('grdiv').appendChild(newsubjf);
      document.getElementById('podiv').appendChild(newsubjg);
      const rese = document.createElement('option');
      rese.id = subj.value+'scorem';
      rese.innerHTML = scorcy.innerHTML;
      totals.appendChild(rese);
      const resel = document.createElement('option');
      resel.id = subj.value+'scoren'; 
      resel.innerHTML = subj.value+'score';
      allsubs.appendChild(resel);
      scorly.innerHTML = Number(scorly.innerHTML) + Number(1);
let totb = 0;

for (const option of totaler.options) {
  totb += Number(option.value);
}
          ototal.innerHTML = totb;
          oaver.innerHTML = Number(ototal.innerHTML)/Number(scorly.innerHTML);
          oper.value = oaver.innerHTML
      ">OK</button>
    <br>
    EDIT SUBJECT
    <input type="text" style="width: 150px; height: 50px;" placeholder="Enter Student's Name" id="esubj">
    <input type="number" style="width: 150px; height: 50px;" placeholder="Enter 1st C.A.T." id="ecatone">
    <input type="number" style="width: 150px; height: 50px;" placeholder="Enter 2nd C.A.T." id="ecattwo">
    <input type="number" style="width: 150px; height: 50px;" placeholder="Enter Examination Score" id="eexamsc">
    <input type="text" style="width: 150px; height: 50px;" placeholder="Enter Grade eg, A, A1, A+, etc." id="eegrade">
    <input type="text" style="width: 150px; height: 50px;" placeholder="Enter Position" id="epost">
    <p id="scorsy" style="display: none;"></p>
    <p id="scors" style="display: none;"></p>
    <select multiple style="display: none;" id="totals"></select>
    
    <select style="" id="allsubs"><option>none</option></select>
    <button onclick="
      esubj.value = allsubs.value.replace('score',''); 
      ecatone.value = document.getElementById(allsubs.value+'catone').innerHTML;
      ecattwo.value = document.getElementById(allsubs.value+'cattwo').innerHTML;
      eexamsc.value = document.getElementById(allsubs.value+'examsc').innerHTML;
      eegrade.value = document.getElementById(allsubs.value+'gr').innerHTML;
      epost.value = document.getElementById(allsubs.value+'pst').innerHTML;
      esubj.value = document.getElementById(allsubs.value+'subj').innerHTML;
      ">Select</button>
     <button onclick="
     document.getElementById('scors').innerHTML =   Number(ecatone.value) + Number(ecattwo.value) + Number(eexamsc.value); 
  document.getElementById(allsubs.value+'subj').innerHTML = esubj.value; 
    document.getElementById(allsubs.value+'catone').innerHTML = ecatone.value; 
    document.getElementById(allsubs.value+'cattwo').innerHTML = ecattwo.value; 
    document.getElementById(allsubs.value+'examsc').innerHTML = eexamsc.value; 
    document.getElementById(allsubs.value+'ttl').innerHTML = Number(ecatone.value) + Number(ecattwo.value) + Number(eexamsc.value); 
    document.getElementById(allsubs.value+'gr').innerHTML = eegrade.value; 
    document.getElementById(allsubs.value+'pst').innerHTML = epost.value; 
      document.getElementById(allsubs.value+'m').innerHTML = Number(ecatone.value) + Number(ecattwo.value) + Number(eexamsc.value);
       document.getElementById(allsubs.value+'n').innerHTML = esubj.value+'score';
       let totae = 0;
       for (const option of totaler.options) {
  totae += Number(option.value);
}
          ototal.innerHTML = totae;
          oaver.innerHTML = Number(ototal.innerHTML)/Number(scorly.innerHTML);
          oper.value = oaver.innerHTML;
      ">Apply</button>
    <br>
    No of subjects:
    <p id="scorly" style="">0</p>
       
   
    <br>
        <button onclick="
          scorly.innerHTML = Number(scorly.innerHTML) - Number(1);
          document.getElementById(allsubs.value+'m').remove();
          document.getElementById(allsubs.value+'subj').remove();
          document.getElementById(allsubs.value+'catone').remove();
          document.getElementById(allsubs.value+'cattwo').remove();
          document.getElementById(allsubs.value+'examsc').remove();
          document.getElementById(allsubs.value+'ttl').remove();
          document.getElementById(allsubs.value+'gr').remove();
          document.getElementById(allsubs.value+'pst').remove();
          document.getElementById(allsubs.value+'n').remove();
          let totae = 0;

for (const option of totaler.options) {
  totae += Number(option.value);
}
          ototal.innerHTML = totae;
          oaver.innerHTML = Number(ototal.innerHTML)/Number(scorly.innerHTML);
          oper.value = oaver.innerHTML;
      ">Delete Subject</button>
  </div>
  <div id="workspace" style=" display: block;background-color: rgb(200, 255, 255); height: auto; padding: 20px; width: 1230px; font-family: comic sans ms; color: black; font-size: 35px;">
    STUDENT'S RESULT
    <div id="workspac" style="display: flex; white-space: nowrap; flex-direction: row;">
    <div style="border-width: 2px; border-color: black; display: block;" id="nadiv">Name</div>
    <div style="border-width: 2px; border-color: black; width: 200px;" id="codiv">1st C.A.T</div>
    <div style="border-width: 2px; border-color: black; width: 200px;" id="ctdiv">2nd C.A.T</div>
    <div style="border-width: 2px; border-color: black;" id="exdiv">Examination</div>
    <div style="border-width: 2px; border-color: black;" id="todiv">Total</div>
    <div style="border-width: 2px; border-color: black;" id="grdiv" contenteditable="true">Grade</div>
    <div style="border-width: 2px; border-color: black;" id="podiv" contenteditable="true">Position</div>
    <div style="border-width: 2px; border-color: black; width: 350px;" id="indiv" contenteditable="true">Instructor's Comment</div></div>
  </div>
  <style>
    #workspac div {
      
      margin: 10px;
    }
  </style>
  Total: <t id="ototal"></t>
  Average: <t id="oaver"></t>
  <br>
  <button onclick="
    const sortee = [...totaler.options]
  .map(option => Number(option.value || option.text))
  .sort((a, b) => b - a);

document.getElementById('sorter').innerHTML = sortee.join(',');
    ">Sort Totals</button>
  <p id="sorter"></p> 
  <br>
  Performance: <input type="range" id="oper" min="0.0" max="100">
</body>
</html>
<style>
  #header {
    position: fixed;
    top: 0px;
    left: 0px;
    right: 0px;
    background-color: cyan;
    padding: 40px;
    min-height: 50px;
    display: none;
  }
    #opener {
    position: fixed;
    top: 100px;
    display: flex;
    align-items: center;
    background-color: aliceblue;
    padding: 40px;
    min-height: 150px;
    width: auto;
    padding: 60px;
  }
  body {
    padding-top: 200px;
    padding-left: 30px;
    padding-left: 30px;
    font-family: century gothic;
    text-align: center;
  }
</style>
<script>
  const stuname = document.getElementById('stuname');
  const stulass = document.getElementById('stulass');
  const stuhool = document.getElementById('stuhool');
  const namee = document.getElementById('namee');
  const catone = document.getElementById('catone');
  const cattwo = document.getElementById('cattwo');
  const examsc = document.getElementById('examsc');
  const egrade = document.getElementById('egrade');
  const post = document.getElementById('post');
  const ecatone = document.getElementById('ecatone');
  const ecattwo = document.getElementById('ecattwo');
  const eexamsc = document.getElementById('eexamsc');
  const eegrade = document.getElementById('eegrade');
  const epost = document.getElementById('epost');
  const subj = document.getElementById('subj');
  const esubj = document.getElementById('esubj');
  const scorcy = document.getElementById('scorsy');
  const scory = document.getElementById('scors');
  const scorly = document.getElementById('scorly');
  const totaler = document.getElementById('totals');
  const ototal = document.getElementById('ototal');
  const oaver = document.getElementById('oaver');
  const oper = document.getElementById('oper');
  const allsubs = document.getElementById('allsubs');
  const partsub = document.getElementById(allsubs.value);
  const partsubn = document.getElementById(allsubs.value+'n');
  </script>
