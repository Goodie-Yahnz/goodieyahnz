<!DOCTYPE html>
<html>
<head>
  <title>Resultly</title>
</head>
<body style="background-color: black; color: lightyellow;">
  <header id="header">
    <button style="width: 50px; height: 50px; background-color: yellow;">Add Subject</button>
  </header>
  <div id="opener">
    <input type="text" style="width: 150px; height: 150px;" placeholder="Enter Student's Name" id="stuname">
    <input type="text" style="width: 150px; height: 150px;" placeholder="Enter Student's Class" id="stulass">
    <input type="text" style="width: 150px; height: 150px;" placeholder="Enter Student's School" id="stuhool">
    <button onclick="
      document.getElementById('header').style.display = 'block';
      namee.innerHTML = 'Result belonging to '+stuname.value+', a student of '+stuhool.value+' in '+stulass.value+' class.'; 
      ">OK</button>
  </div>
  <div id="addsub" style="display: none;">
    <input type="text" style="width: 150px; height: 150px;" placeholder="Enter Student's Name" id="stuname">
    <input type="text" style="width: 150px; height: 150px;" placeholder="Enter Student's Class" id="stulass">
    <input type="text" style="width: 150px; height: 150px;" placeholder="Enter Student's School" id="stuhool">
    <button onclick="
      document.getElementById('header').style.display = 'block';
      namee.innerHTML = 'Result belonging to '+stuname.value+', a student of '+stuhool.value+' in '+stulass.value+' class.'; 
      ">OK</button>
  </div>
  <h1>RESULTLY</h1>
  <h2>Goodie Yahnz's Smart Result Setter</h2>
  <h3 id="namee">A school student's result</h3>
</body>
</html>
