<!DOCTYPE html>
<html>
<head>
  <title>Resultly</title>
</head>
<body style="background-color: black; color: lightyellow;">
  <header id="header">
    <button style="width: 80px; height: 50px; background-color: yellow;" onclick="document.getElementById('addsub').style.display = 'block';">Add Subject</button>
  </header>
  <div id="opener">
    BEFORE YOU START
    <input type="text" style="width: 200px; height: 50px;" placeholder="Enter Student's Name" id="stuname">
    <input type="text" style="width: 150px; height: 50px;" placeholder="Enter Student's Class" id="stulass">
    <input type="text" style="width: 250px; height: 50px;" placeholder="Enter Student's School" id="stuhool">
    <button onclick="
      document.getElementById('header').style.display = 'block';
      document.getElementById('opener').style.display = 'none';
      namee.innerHTML = 'Result belonging to '+stuname.value+', a student of '+stuhool.value+' in '+stulass.value+' class.'; 
      ">OK</button>
  </div>
  <div id="addsub" style="display: none;">
    <input type="text" style="width: 150px; height: 50px;" placeholder="Enter Subject" id="subj">
    <input type="text" style="width: 150px; height: 50px;" placeholder="Enter 1st C.A.T." id="catone">
    <input type="text" style="width: 150px; height: 50px;" placeholder="Enter 2nd C.A.T." id="cattwo">
    <input type="text" style="width: 150px; height: 50px;" placeholder="Enter Examination Score" id="examsc">
    <input type="text" style="width: 150px; height: 50px;" placeholder="Enter Grade eg, A, A1, A+, etc." id="egrade">
    <input type="text" style="width: 150px; height: 50px;" placeholder="Enter Position" id="post">
    <p id="scorsy" style="display: none;"></p>
    <select multiple style="" id="totals"></select>
    <select style="" id="allsubs"></select>No of subjects:
    <p id="scorly" style="">0</p>
        <button onclick="
      document.getElementById('addsub').style.display = 'none';
      document.getElementById('scorsy').innerHTML =   Number(catone.value) + Number(cattwo.value) + Number(examsc.value);;
      const total = Function('return '+document.getElementById('scorsy').innerHTML);
      const newsubj = document.createElement('p');
      newsubj.id = subj.value+'score';
      newsubj.innerHTML = subj.value+' '+catone.value+' '+cattwo.value+' '+examsc.value+' '+scorcy.innerHTML+' '+egrade.value+' '+post.value;
      document.getElementById('workspace').appendChild(newsubj);
      const rese = document.createElement('option');
      rese.innerHTML = scorcy.innerHTML;
      totals.appendChild(rese);
      const resel = document.createElement('option');
      resel.id = subj.value+'area'; 
      resel.innerHTML = subj.value+'score';
      allsubs.appendChild(resel);
      scorly.innerHTML = Number(scorly.innerHTML) + Number(1);
let totae = 0;

  totae += Number(option.value);
}
          ototal.innerHTML = totae;
          oaver.innerHTML = Number(otoal.innerHTML)/Number(scorly.innerHTML);
      ">OK</button>
  </div>
  <h1>RESULTLY</h1>
  <h2>Goodie Yahnz's Smart Result Setter</h2>
  <h3 id="namee">A school student's result</h3>
  <div id="workspace" style="background-color: rgb(200, 255, 255); height: auto; padding: 20px; width: 1150px; font-family: comic sans ms; color: black; font-size: 35px;">
    STUDENT'S RESULT
  </div>
  Total: <t id="ototal"></t>
  Average: <t id="oaver"></t>
</body>
</html>

  const stuname = document.getElementById('stuname');
  const stulass = document.getElementById('stulass');
  const stuhool = document.getElementById('stuhool');
  const namee = document.getElementById('namee');
  const catone = document.getElementById('catone');
  const cattwo = document.getElementById('cattwo');
  const examsc = document.getElementById('examsc');
